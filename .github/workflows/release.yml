name: Release plugin
# Push a tag <slug>-v<version> (for example silence-markers-v0.1.0) to publish plugins/<slug>.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Read the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "slug=${tag%-v*}" >> "$GITHUB_OUTPUT"
      - name: Use the tagged plugin sources
        run: git checkout "${{ steps.tag.outputs.tag }}" -- "plugins/${{ steps.tag.outputs.slug }}"
      - name: Test
        run: |
          folder="plugins/${{ steps.tag.outputs.slug }}"
          if [ -x "$folder/build.sh" ]; then "$folder/build.sh"; fi
          if [ -d "$folder/tests" ]; then python3 -m unittest discover -s "$folder/tests" -v; fi
      - name: Package, sign and register
        id: package
        env:
          BASHCUT_SIGNING_KEY: ${{ secrets.BASHCUT_SIGNING_KEY }}
        run: |
          if [ -z "$BASHCUT_SIGNING_KEY" ]; then echo "::error::The BASHCUT_SIGNING_KEY secret is missing"; exit 1; fi
          out=$(python3 scripts/package.py "${{ steps.tag.outputs.slug }}" --tag "${{ steps.tag.outputs.tag }}" --register)
          echo "$out"
          echo "archive=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["archive"])')" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${{ steps.package.outputs.archive }}"
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.tag.outputs.tag }} already exists; bump the version instead of re-publishing"
            exit 1
          fi
          gh release create "${{ steps.tag.outputs.tag }}" "$archive" "$archive.sha256" "$archive.sig" \
            --title "${{ steps.tag.outputs.tag }}" --notes "Plugin \`${{ steps.tag.outputs.slug }}\`. SHA-256: $(cut -d' ' -f1 "$archive.sha256")"
          # Verify what was published, not what was built.
          mkdir -p check && gh release download "${{ steps.tag.outputs.tag }}" -p '*.zip' -D check
          shasum -a 256 -c <(sed "s#  #  check/#" "$archive.sha256")
          swift scripts/verify-registry.swift registry.json
      - name: Commit registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --staged . && git checkout -- plugins
          git add registry.json
          git commit -m "registry: ${{ steps.tag.outputs.tag }}"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
