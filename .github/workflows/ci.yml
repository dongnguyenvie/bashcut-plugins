name: CI
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate registry
        run: |
          python3 -c "import json; r=json.load(open('registry.json')); assert r['schemaVersion'] == 1"
          python3 scripts/build-registry.py --check
          swift scripts/verify-registry.swift registry.json
      - name: Test the plugin templates
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test and package every plugin
        run: |
          for folder in plugins/*/; do
            slug=$(basename "$folder")
            if [ -x "$folder/build.sh" ]; then "$folder/build.sh"; fi
            if ls "$folder"/tests/test_*.py >/dev/null 2>&1; then python3 -m unittest discover -s "$folder/tests" -v; fi
            if [ -f "$folder/package.json" ]; then (cd "$folder" && npm test); fi
            python3 scripts/package.py "$slug"
          done
