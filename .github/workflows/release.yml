name: Release plugin
# Push a tag <slug>-v<version> (for example silence-markers-v0.1.0) to publish plugins/<slug>.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write
  pull-requests: write   # when main only takes pull requests, the registry commit goes in through one

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read the tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "slug=${tag%-v*}" >> "$GITHUB_OUTPUT"
      - name: Use the tagged plugin sources
        # The tag's code, but main's versions.json: it holds versions and yanks made after the tag.
        run: |
          folder="plugins/${{ steps.tag.outputs.slug }}"
          if [ -f "$folder/versions.json" ]; then cp "$folder/versions.json" "$RUNNER_TEMP/versions.json"; fi
          git checkout "${{ steps.tag.outputs.tag }}" -- "$folder"
          if [ -f "$RUNNER_TEMP/versions.json" ]; then cp "$RUNNER_TEMP/versions.json" "$folder/versions.json"; fi
      - name: Test
        run: |
          folder="plugins/${{ steps.tag.outputs.slug }}"
          if [ -x "$folder/build.sh" ]; then "$folder/build.sh"; fi
          if ls "$folder"/tests/test_*.py >/dev/null 2>&1; then python3 -m unittest discover -s "$folder/tests" -v; fi
          if [ -f "$folder/package.json" ]; then (cd "$folder" && npm test); fi
      - name: Package, sign and register
        id: package
        env:
          BASHCUT_SIGNING_KEY: ${{ secrets.BASHCUT_SIGNING_KEY }}
        run: |
          if [ -z "$BASHCUT_SIGNING_KEY" ]; then echo "::error::The BASHCUT_SIGNING_KEY secret is missing"; exit 1; fi
          out=$(python3 scripts/package.py "${{ steps.tag.outputs.slug }}" --tag "${{ steps.tag.outputs.tag }}" --register)
          echo "$out"
          echo "archive=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["archive"])')" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="${{ steps.package.outputs.archive }}"
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.tag.outputs.tag }} already exists; bump the version instead of re-publishing"
            exit 1
          fi
          gh release create "${{ steps.tag.outputs.tag }}" "$archive" "$archive.sha256" "$archive.sig" \
            --title "${{ steps.tag.outputs.tag }}" --notes "Plugin \`${{ steps.tag.outputs.slug }}\`. SHA-256: $(cut -d' ' -f1 "$archive.sha256")"
          # Verify what was published, not what was built.
          mkdir -p check && gh release download "${{ steps.tag.outputs.tag }}" -p '*.zip' -D check
          shasum -a 256 -c <(sed "s#  #  check/#" "$archive.sha256")
          swift scripts/verify-registry.swift registry.json
      - name: Commit versions.json and registry.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          folder="plugins/${{ steps.tag.outputs.slug }}"
          # Keep only the new versions.json; everything else in plugins/ goes back to main.
          cp "$folder/versions.json" "$RUNNER_TEMP/new-versions.json"
          git restore --staged . && git checkout -- plugins && git clean -fdq plugins
          cp "$RUNNER_TEMP/new-versions.json" "$folder/versions.json"
          python3 scripts/build-registry.py
          git add registry.json "$folder/versions.json"
          tag="${{ steps.tag.outputs.tag }}"
          git commit -m "registry: $tag"
          for attempt in 1 2 3 4 5; do
            if out=$(git push origin HEAD:main 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            # A protected main (pull requests only) refuses the push: hand the commit over in a pull request.
            if echo "$out" | grep -qE "GH006|GH013|protected branch"; then
              branch="registry/$tag"
              git push --force origin "HEAD:refs/heads/$branch"
              url=$(gh pr create --base main --head "$branch" --title "registry: $tag" \
                --body "Registry update for the release \`$tag\`, opened by the release workflow because main only takes pull requests.")
              echo "Opened $url"
              gh pr merge "$url" --merge --delete-branch && exit 0
              echo "::error::Could not merge $url; merge it to list $tag in the registry"
              exit 1
            fi
            if ! git pull --rebase origin main; then
              # Another plugin's release changed registry.json: it is generated, so build it again.
              git diff --name-only --diff-filter=U | grep -qvx registry.json && exit 1
              python3 scripts/build-registry.py && git add registry.json
              GIT_EDITOR=true git rebase --continue || exit 1
            fi
          done
          exit 1
