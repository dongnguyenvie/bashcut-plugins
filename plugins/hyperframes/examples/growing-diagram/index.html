<!doctype html>
<!-- A system diagram that grows with the voice: nodes and edges land on their own `at` and light up, dots run on new edges. Data is JSON {title, nodes:[{id,label,icon?,group?,at?}], edges:[{from,to,label?,at?}]}; look flow or iso; labels 38 px+ on 1080 wide. Transparent, the project's canvas, 12 s. -->
<!-- Pitfalls:
  - One graphic for the whole diagram, never one per section. In graphic plan give `at` as "@words" (the word that
    names the node): either one row spanning the sections, or one row per section with the same `render.scene` id
    (the first row carries composition and set; plan renders each row as a slice of one scene, sets t0 and total, and
    "@words" count from the scene's start, so slices meet without a jump).
  - A node without `at` is there from the start; an edge without `at` is drawn when both ends are there. Give an
    edge its own `at` only when the voice names the link itself.
  - Up to 10 nodes keep labels at 38 px or more on 9:16; labels 1–3 words. More: split the story into two scenes.
  - Pass the data with `--set data=@diagram.json` in place (there `at` takes seconds or "line:N"/"section:Label").
-->
<html lang="en" data-composition-variables='[
  {"id": "data", "type": "string", "label": "Diagram (JSON {title, nodes:[{id, label, icon?, group?, at?}], edges:[{from, to, label?, at?}]})", "default": "{\"title\": \"How an order flows\", \"nodes\": [{\"id\": \"app\", \"label\": \"Mobile app\", \"icon\": \"📱\", \"at\": 0.6}, {\"id\": \"api\", \"label\": \"API gateway\", \"at\": 2.2}, {\"id\": \"orders\", \"label\": \"Order service\", \"group\": \"core\", \"at\": 4.0}, {\"id\": \"pay\", \"label\": \"Payment\", \"group\": \"core\", \"at\": 5.8}, {\"id\": \"db\", \"label\": \"Database\", \"icon\": \"🗄️\", \"at\": 7.4}, {\"id\": \"mail\", \"label\": \"Email\", \"at\": 9.0}], \"edges\": [{\"from\": \"app\", \"to\": \"api\"}, {\"from\": \"api\", \"to\": \"orders\"}, {\"from\": \"orders\", \"to\": \"pay\"}, {\"from\": \"orders\", \"to\": \"db\"}, {\"from\": \"orders\", \"to\": \"mail\", \"label\": \"event\"}, {\"from\": \"pay\", \"to\": \"db\", \"at\": 10.4}]}"},
  {"id": "look", "type": "string", "label": "flow (boxes and arrows) or iso (isometric blocks)", "default": "flow"},
  {"id": "title", "type": "string", "label": "Title when data has none (empty: no title)", "default": ""},
  {"id": "packets", "type": "boolean", "label": "Data dots run along new edges", "default": true},
  {"id": "t0", "type": "number", "label": "Scene second this render starts at (a slice of a longer scene; graphic plan sets it)", "default": 0},
  {"id": "total", "type": "number", "label": "Scene length in seconds (0: the length of this render; graphic plan sets it)", "default": 0},
  {"id": "accent", "type": "color", "label": "Highlight colour (ring, dots, hot edges)", "default": "#FFB020"},
  {"id": "background", "type": "color", "label": "Node plate colour", "default": "#0E1016"},
  {"id": "text", "type": "color", "label": "Text and edge colour", "default": "#FFFFFF"},
  {"id": "secondary", "type": "color", "label": "Second group / block colour", "default": "#5AA9E6"},
  {"id": "headingFont", "type": "font", "label": "Label font (empty keeps the design font)", "default": ""},
  {"id": "bodyFont", "type": "font", "label": "Edge label font (empty keeps the design font)", "default": ""}
]'>
  <head>
    <meta charset="UTF-8" />
    <script src="gsap.min.js"></script>
    <script src="diagram.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Brand look: diagram.js fills --accent, --background, --text, --secondary and the fonts from the variables. */
      :root { --heading-font: "Helvetica Neue"; --body-font: "Helvetica Neue"; --hand-font: "Chalkboard SE", "Marker Felt", "Comic Sans MS";
        --accent: #FFB020; --background: #0E1016; --text: #FFFFFF; --secondary: #585B63; }
      html, body { background: transparent; overflow: hidden; }
      #root { position: relative; overflow: hidden; font-family: var(--body-font), Arial, sans-serif; }
      .dg-label { font-family: var(--heading-font), Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920" data-fit="canvas"></div>
    <script>
      const v = window.__hyperframes.getVariables();
      const tl = gsap.timeline({ paused: true });
      // Layout, growth, the scene slice (t0, total) and the exit (END - 0.5 of the scene) come from diagram.js.
      const iso = String(v.look).trim().toLowerCase() === "iso";
      BCDiagram.mount(tl, v, iso ? "iso" : "flow", document.getElementById("root"),
        { fonts: iso ? { maxFont: 48, minFont: 34 } : { maxFont: 60, minFont: 38 } });
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
